services:
  flower-server-lstm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flower-server-lstm-ci
    image: flower-server:latest
    environment:
      - FL_SERVER_ADDRESS=0.0.0.0:8080
      - FL_MIN_CLIENTS=2
      - FL_NUM_ROUNDS=2
      - FL_DASHBOARD_URL=http://fl-dashboard:5000
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    command: >
      python flower_server_metrics.py
      --address 0.0.0.0
      --port 8080
      --min-clients 2
      --num-rounds 2
      --dashboard-url http://fl-dashboard:5000
      --model-type LSTM
      --models-dir /app/models
    networks:
      - flower-network
    depends_on:
      - fl-dashboard
      - mlflow-server
    volumes:
      - ./models:/app/models

  fl-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: fl-dashboard-ci
    image: fl-dashboard:latest
    networks:
      - flower-network

  flower-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: flower-worker-1-ci
    image: flower-worker:latest
    environment:
      - FL_SERVER_ADDRESS=flower-server-lstm:8080
    command: >
      python flower_worker.py
      --server-address flower-server-lstm:8080
      --worker-id worker1
      --total-rounds 2
    depends_on:
      - flower-server-lstm
    networks:
      - flower-network
    volumes:
      - ./dataset_sdn.csv:/app/dataset_sdn.csv:ro

  flower-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: flower-worker-2-ci
    image: flower-worker:latest
    environment:
      - FL_SERVER_ADDRESS=flower-server-lstm:8080
    command: >
      python flower_worker.py
      --server-address flower-server-lstm:8080
      --worker-id worker2
      --total-rounds 2
    depends_on:
      - flower-server-lstm
    networks:
      - flower-network
    volumes:
      - ./dataset_sdn.csv:/app/dataset_sdn.csv:ro

  mlflow-server:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow-server-ci
    image: mlflow-server:latest
    volumes:
      - ./mlruns:/app/mlruns
    # Expose MLflow UI to the host for temporary access during CI runs.
    # Map host port 5002 -> container port 5000 to avoid conflicts with other host services.
    ports:
      - "5002:5000"
    networks:
      - flower-network

networks:
  flower-network:
    driver: bridge
