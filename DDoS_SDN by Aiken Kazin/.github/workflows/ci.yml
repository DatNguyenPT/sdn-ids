name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  # Quick validation on PRs
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install pandas numpy
      
      - name: Validate dataset
        run: |
          python mlops/validate_data.py || echo "Validation check (non-blocking)"
        continue-on-error: true
      
      - name: Check imports
        run: |
          python -c "import flower_worker; import flower_server_metrics; print('✅ Imports OK')"
        continue-on-error: true

  # Code quality checks
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install linting tools
        run: |
          pip install flake8 black
      
      - name: Check formatting
        run: |
          black --check . || echo "Formatting issues found (non-blocking)"
        continue-on-error: true
      
      - name: Lint
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
        continue-on-error: true

