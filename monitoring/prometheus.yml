global:
  scrape_interval: 15s 
  evaluation_interval: 15s


alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - localhost:9093

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"

    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"
  
  - job_name: "jenkins"
    metrics_path: "/prometheus/"
    static_configs:
      - targets: ["13.215.205.125:8080"]
        labels:
          app: "jenkins"

  - job_name: "nexus"
    metrics_path: "/service/metrics/prometheus"
    basic_auth:
      username: "prometheus"
      password: ""
    static_configs:
      - targets: ["13.215.205.125:8081"]