name: Federated Learning Training Pipeline

on:
  # Trigger on push to main branch (for testing/development)
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/**'
      - 'DDoS_SDN by Aiken Kazin/flower_worker.py'
      - 'DDoS_SDN by Aiken Kazin/flower_server_metrics.py'
      - 'DDoS_SDN by Aiken Kazin/train.py'
      - 'DDoS_SDN by Aiken Kazin/mlops/**'
      - 'DDoS_SDN by Aiken Kazin/dataset_sdn.csv'
  
  # Scheduled: Weekly retraining every Sunday at 2 AM UTC
  schedule:
    - cron: '0 2 * * 0'
  
  # Manual trigger with options
  workflow_dispatch:
    inputs:
      model_type:
        description: 'Model type to train'
        required: true
        default: 'MLPv2'
        type: choice
        options:
          - MLPv2
          - LSTM
          - CNN1D
          - CNN_LSTM
          - all
      num_rounds:
        description: 'Number of FL rounds'
        required: false
        default: 5
        type: number
      enable_dp:
        description: 'Enable Differential Privacy'
        required: false
        default: false
        type: boolean
      iid:
        description: 'IID distribution (true) or Non-IID (false)'
        required: false
        default: true
        type: boolean
  
  # Run on push to main branch (optional - can be disabled)
  # push:
  #   branches:
  #     - main

jobs:
  # Job 1: Data Validation
  validate-data:
    name: Validate Dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        working-directory: "DDoS_SDN by Aiken Kazin"
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn
      
      - name: Validate dataset
        working-directory: "DDoS_SDN by Aiken Kazin"
        run: |
          python mlops/validate_data.py
      
      - name: Check data quality
        working-directory: "DDoS_SDN by Aiken Kazin"
        run: |
          python mlops/setup_baseline.py || echo "Baseline already exists or failed"
        continue-on-error: true

  # Job 2: Code Quality Checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install linting tools
        working-directory: "DDoS_SDN by Aiken Kazin"
        run: |
          pip install flake8 black
      
      - name: Check code formatting with Black
        working-directory: "DDoS_SDN by Aiken Kazin"
        run: |
          black --check --diff .
        continue-on-error: true
      
      - name: Lint with flake8
        working-directory: "DDoS_SDN by Aiken Kazin"
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

  # Job 3: FL Training (runs after validation)
  # Note: Matrix strategy trains all models in parallel
  # For single model training, use workflow_dispatch with model_type input
  fl-training:
    name: FL Training - ${{ matrix.model_type }}
    needs: [validate-data]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2  # Build max 2 models at a time to save disk space
      matrix:
        # Train models (2 at a time to avoid disk space issues)
        model_type: [MLPv2, LSTM, CNN1D, CNN_LSTM]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Verify Docker and Docker Compose
        run: |
          docker --version
          docker compose version
          echo "📊 Initial disk space:"
          df -h
      
      - name: Clean Docker before starting
        run: |
          # Remove unused containers, networks, images
          docker system prune -af --volumes || true
          docker builder prune -af || true
          echo "📊 Disk space after cleanup:"
          df -h
      
      - name: Change to project directory
        run: |
          cd "DDoS_SDN by Aiken Kazin"
          pwd
          ls -la | head -10
      
      - name: Check dataset file
        working-directory: "DDoS_SDN by Aiken Kazin"
        run: |
          if [ ! -f "dataset_sdn.csv" ]; then
            echo "❌ dataset_sdn.csv not found!"
            echo "Please ensure the dataset is committed or use a data repository"
            exit 1
          else
            echo "✅ Dataset file found"
            ls -lh dataset_sdn.csv
          fi
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        working-directory: "DDoS_SDN by Aiken Kazin"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server.txt
          pip install -r requirements-worker.txt
          pip install mlflow
      
      - name: Start MLflow server
        working-directory: "DDoS_SDN by Aiken Kazin"
        run: |
          mlflow server --backend-store-uri sqlite:///mlflow.db \
                        --default-artifact-root ./mlruns \
                        --host 0.0.0.0 --port 5000 &
          sleep 5
        continue-on-error: true
      
      - name: Clean Docker system (free disk space)
        run: |
          docker system prune -f || true
          docker builder prune -f || true
          df -h
      
      - name: Start FL infrastructure for ${{ matrix.model_type }}
        working-directory: "DDoS_SDN by Aiken Kazin"
        run: |
          # Set environment variables
          export FL_ENABLE_DP=${{ github.event.inputs.enable_dp || 'false' }}
          export IID=${{ github.event.inputs.iid || 'true' }}
          export NUM_ROUNDS=${{ github.event.inputs.num_rounds || 5 }}
          
          # Create models directory if it doesn't exist
          mkdir -p models
          
          # Check disk space
          echo "📊 Disk space before starting services:"
          df -h
          
          # Start only the required services for this model type
          # Start dashboard and MLflow first (dependencies)
          # Try to use existing images first, build only if needed
          if ! docker compose up -d fl-dashboard mlflow-server 2>/dev/null; then
            echo "Building dashboard and MLflow..."
            docker compose build fl-dashboard mlflow-server
            docker compose up -d fl-dashboard mlflow-server
            docker builder prune -f || true
          fi
          
          # Wait for dependencies to be ready
          echo "Waiting for dashboard and MLflow to be ready..."
          sleep 10
          
          # Start the specific model's server - BUILD ONLY THIS ONE
          # Server names in docker-compose: flower-server-mlpv2, flower-server-cnn1d, 
          # flower-server-lstm, flower-server-cnn_lstm
          MODEL_TYPE_LOWER=$(echo "${{ matrix.model_type }}" | tr '[:upper:]' '[:lower:]')
          
          # Build server image first (single build)
          echo "🔨 Building server image for ${{ matrix.model_type }}..."
          docker compose build flower-server-$MODEL_TYPE_LOWER
          
          # Start server
          docker compose up -d flower-server-$MODEL_TYPE_LOWER
          
          # Clean up build cache after building server
          docker builder prune -f || true
          echo "📊 Disk space after server build:"
          df -h
          
          # Wait for server to be ready
          echo "Waiting for FL server to be ready..."
          sleep 5
          
          # Start workers for this model (2 workers per model)
          # Workers are named: flower-worker-1, flower-worker-2, etc.
          # Each model uses 2 workers (workers 1-2 for MLPv2, 3-4 for CNN1D, etc.)
          
          # Map model types to worker pairs based on docker-compose.yml
          # Actual mapping:
          # Workers 1-2: MLPv2
          # Workers 3-4: CNN1D
          # Workers 5-6: LSTM
          # Workers 7-8: CNN_LSTM
          case "$MODEL_TYPE_LOWER" in
            mlpv2)
              WORKERS="flower-worker-1 flower-worker-2"
              ;;
            cnn1d)
              WORKERS="flower-worker-3 flower-worker-4"
              ;;
            lstm)
              WORKERS="flower-worker-5 flower-worker-6"
              ;;
            cnn_lstm)
              WORKERS="flower-worker-7 flower-worker-8"
              ;;
            *)
              echo "❌ Unknown model type: ${{ matrix.model_type }}"
              echo "Available: MLPv2, LSTM, CNN1D, CNN_LSTM"
              exit 1
              ;;
          esac
          
          echo "✅ Model: ${{ matrix.model_type }}"
          echo "✅ Server: flower-server-$MODEL_TYPE_LOWER"
          echo "✅ Workers: $WORKERS"
          
          # Build workers one at a time to save disk space
          echo "🔨 Building worker images (one at a time to save space)..."
          for worker in $WORKERS; do
            echo "Building $worker..."
            docker compose build $worker
            docker compose up -d $worker
            # Clean up after each build
            docker builder prune -f || true
            echo "📊 Disk space after $worker:"
            df -h
            sleep 2
          done
          
          # Wait for workers to connect
          sleep 10
          
          # Show status and disk space
          echo "📊 Container status:"
          docker compose ps
          echo "📊 Disk space after starting services:"
          df -h
        env:
          FL_MODEL_TYPE: ${{ matrix.model_type }}
      
      - name: Monitor FL Training
        working-directory: "DDoS_SDN by Aiken Kazin"
        run: |
          echo "Monitoring FL training for ${{ matrix.model_type }}..."
          # Wait for training to complete (max 1 hour)
          timeout 3600 bash -c '
            while true; do
              if docker compose ps | grep -q "flower-server-${{ matrix.model_type }}.*healthy"; then
                if docker compose logs --tail=10 flower-server-${{ matrix.model_type }} | grep -q "Training finished\|All.*rounds completed"; then
                  echo "Training completed!"
                  break
                fi
              fi
              sleep 10
            done
          ' || echo "Training timeout or still running"
        continue-on-error: true
      
      - name: Collect Training Logs
        if: always()
        working-directory: "DDoS_SDN by Aiken Kazin"
        run: |
          echo "=== FL Server Logs ==="
          docker compose logs flower-server-${{ matrix.model_type }} || true
          echo "=== FL Worker Logs ==="
          docker compose logs --tail=50 flower-worker-1 || true
        continue-on-error: true
      
      - name: Check Model Files
        if: always()
        working-directory: "DDoS_SDN by Aiken Kazin"
        run: |
          if [ -f "models/${{ matrix.model_type }}_FL.h5" ]; then
            echo "✅ Model file created: models/${{ matrix.model_type }}_FL.h5"
            ls -lh models/${{ matrix.model_type }}_FL.h5
          else
            echo "❌ Model file not found"
            exit 1
          fi
        continue-on-error: true
      
      - name: Upload Model Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ matrix.model_type }}
          path: |
            DDoS_SDN by Aiken Kazin/models/${{ matrix.model_type }}_FL.h5
            DDoS_SDN by Aiken Kazin/mlruns/
          retention-days: 7
        continue-on-error: true
      
      - name: Cleanup
        if: always()
        working-directory: "DDoS_SDN by Aiken Kazin"
        run: |
          docker compose down -v || true
          docker system prune -af || true
          docker builder prune -af || true
          echo "📊 Final disk space:"
          df -h

  # Job 4: Model Evaluation (runs after training)
  evaluate-models:
    name: Evaluate Models
    needs: [fl-training]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: model-*
          merge-multiple: true
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        working-directory: "DDoS_SDN by Aiken Kazin"
        run: |
          pip install -r requirements-worker.txt
          pip install pandas numpy scikit-learn matplotlib seaborn
      
      - name: Evaluate models
        working-directory: "DDoS_SDN by Aiken Kazin"
        run: |
          for model in models/*_FL.h5; do
            if [ -f "$model" ]; then
              echo "Evaluating $model..."
              python evaluate.py --model-name $(basename $model) || echo "Evaluation failed for $model"
            fi
          done
        continue-on-error: true

  # Job 5: Summary & Notification
  summary:
    name: Training Summary
    needs: [validate-data, code-quality, fl-training, evaluate-models]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Training Summary
        run: |
          echo "## FL Training Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Jobs Status:" >> $GITHUB_STEP_SUMMARY
          echo "- Data Validation: ${{ needs.validate-data.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- FL Training: ${{ needs.fl-training.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Model Evaluation: ${{ needs.evaluate-models.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Check MLflow UI for experiment tracking" >> $GITHUB_STEP_SUMMARY
          echo "2. Review model artifacts" >> $GITHUB_STEP_SUMMARY
          echo "3. Compare with previous runs" >> $GITHUB_STEP_SUMMARY

