name: CI Pipeline - Federated Learning (LSTM)

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  PROJECT_DIR: "DDoS_SDN by Aiken Kazin"

jobs:
  stage-1-build:
    name: Stage 1 - Build & Validate Containers
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker Images
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=========================================="
          echo "Stage 1: Building Docker Images"
          echo "=========================================="
          
          # Build all required images
          docker compose -f docker-compose.ci.yml build --no-cache
          
          echo "Docker images built successfully"
      
      - name: Validate Docker Images
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=========================================="
          echo "Validating Docker Images"
          echo "=========================================="
          
          # Check if images exist
          docker images | grep -E "(flower-server|flower-worker|fl-dashboard|mlflow-server)" || true
          
          echo "Docker images validated"

  stage-2-start-system:
    name: Stage 2 - Start FL System (CI Mode)
    runs-on: ubuntu-latest
    needs: stage-1-build
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker Images
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker compose -f docker-compose.ci.yml build --no-cache
      
      - name: Start FL System
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=========================================="
          echo "Stage 2: Starting FL System"
          echo "=========================================="
          
          # Start infrastructure services first (MLflow, Dashboard)
          docker compose -f docker-compose.ci.yml up -d mlflow-server fl-dashboard
          
          # Wait for MLflow to be ready
          echo "Waiting for MLflow server to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:5002/health 2>/dev/null || docker compose -f docker-compose.ci.yml logs mlflow-server | grep -q "listening"; do sleep 2; done' || true
          
          # Start FL server
          docker compose -f docker-compose.ci.yml up -d flower-server-lstm
          
          # Wait for FL server to be ready
          echo "Waiting for FL server to be ready..."
          sleep 10
          
          # Start workers
          docker compose -f docker-compose.ci.yml up -d flower-worker-1 flower-worker-2
          
          echo "FL System started"
          
          # Show running containers
          docker compose -f docker-compose.ci.yml ps

  stage-3-mlflow-health:
    name: Stage 3 - MLflow Health Check
    runs-on: ubuntu-latest
    needs: stage-2-start-system
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker Images
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker compose -f docker-compose.ci.yml build --no-cache
      
      - name: Start FL System
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker compose -f docker-compose.ci.yml up -d mlflow-server fl-dashboard flower-server-lstm flower-worker-1 flower-worker-2
          sleep 15
      
      - name: MLflow Health Check
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=========================================="
          echo "Stage 3: MLflow Health Check"
          echo "=========================================="
          
          # Wait a bit more for services to stabilize
          sleep 5
          
          # Run MLflow health check script
          python scripts/check_mlflow_health.py \
            --mlflow-url http://localhost:5002 \
            --timeout 30 2>&1 | tee mlflow_health_output.log
          
          echo ""
          echo "📊 MLflow Health Statistics:"
          echo "   - Health check completed"
          echo "   - Check mlflow_health_output.log for details"
          
          echo "✅ MLflow health check passed"

  stage-4-smoke-test:
    name: Stage 4 - Run Federated Smoke Test
    runs-on: ubuntu-latest
    needs: stage-3-mlflow-health
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker Images
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker compose -f docker-compose.ci.yml build --no-cache
      
      - name: Start FL System
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker compose -f docker-compose.ci.yml up -d mlflow-server fl-dashboard flower-server-lstm flower-worker-1 flower-worker-2
          sleep 15
      
      - name: Run Federated Smoke Test
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=========================================="
          echo "Stage 4: Running Federated Smoke Test"
          echo "=========================================="
          
          # Run smoke test script and capture output
          python scripts/smoke_test_lstm.py \
            --server-url http://localhost:8080 \
            --mlflow-url http://localhost:5002 \
            --timeout 300 \
            --min-rounds 2 2>&1 | tee smoke_test_output.log
          
          echo ""
          echo "📊 Smoke Test Statistics:"
          echo "   - Test completed successfully"
          echo "   - Check smoke_test_output.log for detailed results"
          
          echo "✅ Federated smoke test passed"

  stage-5-verify:
    name: Stage 5 - Verify System Behavior
    runs-on: ubuntu-latest
    needs: stage-4-smoke-test
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker Images
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker compose -f docker-compose.ci.yml build --no-cache
      
      - name: Start FL System and Wait for Training
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Starting FL system..."
          docker compose -f docker-compose.ci.yml up -d mlflow-server fl-dashboard flower-server-lstm flower-worker-1 flower-worker-2
          
          echo "Waiting for services to start..."
          sleep 20
          
          echo "Waiting for FL training to complete (max 5 minutes)..."
          TIMEOUT=300
          ELAPSED=0
          TRAINING_COMPLETE=false
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            # Check if training completed by looking for completion message in logs
            SERVER_LOGS=$(docker compose -f docker-compose.ci.yml logs flower-server-lstm 2>&1)
            if echo "$SERVER_LOGS" | grep -qE "Training completed|FL training finished|round 2/2|Final round"; then
              echo "✅ Training completed (found in logs)!"
              TRAINING_COMPLETE=true
              break
            fi
            
            # Check if model file exists
            if [ -f "models/LSTM_FL.h5" ]; then
              echo "✅ Model file found!"
              TRAINING_COMPLETE=true
              break
            fi
            
            # Check if server is still waiting (not started training yet)
            if echo "$SERVER_LOGS" | grep -qE "Waiting for clients|Requesting initial parameters"; then
              echo "   Server waiting for clients... ($ELAPSED/$TIMEOUT seconds)"
            elif echo "$SERVER_LOGS" | grep -qE "round 1|round 2|Round"; then
              echo "   Training in progress... ($ELAPSED/$TIMEOUT seconds)"
            else
              echo "   Checking status... ($ELAPSED/$TIMEOUT seconds)"
            fi
            
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done
          
          if [ "$TRAINING_COMPLETE" = false ]; then
            echo "⚠️  Timeout waiting for training completion"
            echo "Checking current status..."
            docker compose -f docker-compose.ci.yml ps
            echo ""
            echo "Server logs (last 30 lines):"
            docker compose -f docker-compose.ci.yml logs flower-server-lstm | tail -30
          fi
      
      - name: Verify System Behavior
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=========================================="
          echo "Stage 5: Verifying System Behavior"
          echo "=========================================="
          
          # Wait a bit more to ensure model file is written
          sleep 5
          
          # Check if model was created
          if [ -f "models/LSTM_FL.h5" ]; then
            echo "✅ Model file created: models/LSTM_FL.h5"
            MODEL_SIZE=$(ls -lh models/LSTM_FL.h5 | awk '{print $5}')
            echo "📊 Model Statistics:"
            echo "   - File: models/LSTM_FL.h5"
            echo "   - Size: $MODEL_SIZE"
            ls -lh models/LSTM_FL.h5
          else
            echo "❌ WARNING: Model file not found, checking logs..."
            echo "Container status:"
            docker compose -f docker-compose.ci.yml ps
            echo ""
            echo "Server logs (last 100 lines):"
            docker compose -f docker-compose.ci.yml logs flower-server-lstm | tail -100
            echo ""
            echo "Worker 1 logs (last 50 lines):"
            docker compose -f docker-compose.ci.yml logs flower-worker-1 | tail -50
            echo ""
            echo "Worker 2 logs (last 50 lines):"
            docker compose -f docker-compose.ci.yml logs flower-worker-2 | tail -50
            exit 1
          fi
          
          # Check MLflow runs
          if [ -d "mlruns" ] && [ "$(ls -A mlruns)" ]; then
            echo "✅ MLflow runs directory exists and contains data"
            echo "📊 MLflow Statistics:"
            echo "   - Runs directory: mlruns/"
            ls -la mlruns/
          else
            echo "⚠️  WARNING: MLflow runs directory empty or missing"
          fi
          
          # Check container status
          echo ""
          echo "📊 Container Status:"
          docker compose -f docker-compose.ci.yml ps
          
          # Extract training metrics from server logs
          echo ""
          echo "📊 Training Statistics (from server logs):"
          docker compose -f docker-compose.ci.yml logs flower-server-lstm | grep -E "(Round|accuracy|loss|Training|completed)" | tail -20 || echo "   No training metrics found in logs"
          
          # Check for errors in logs
          echo ""
          echo "Checking for errors in server logs..."
          if docker compose -f docker-compose.ci.yml logs flower-server-lstm | grep -i "error\|exception\|failed"; then
            echo "⚠️  WARNING: Errors found in server logs"
            docker compose -f docker-compose.ci.yml logs flower-server-lstm | tail -100
          else
            echo "✅ No critical errors found in server logs"
          fi
          
          echo ""
          echo "✅ System behavior verified"
      
      - name: Collect Logs (on failure)
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=========================================="
          echo "Collecting logs for debugging"
          echo "=========================================="
          
          echo "--- FL Server Logs ---"
          docker compose -f docker-compose.ci.yml logs flower-server-lstm || true
          
          echo "--- Worker 1 Logs ---"
          docker compose -f docker-compose.ci.yml logs flower-worker-1 || true
          
          echo "--- Worker 2 Logs ---"
          docker compose -f docker-compose.ci.yml logs flower-worker-2 || true
          
          echo "--- MLflow Server Logs ---"
          docker compose -f docker-compose.ci.yml logs mlflow-server || true
          
          echo "--- Dashboard Logs ---"
          docker compose -f docker-compose.ci.yml logs fl-dashboard || true

  stage-6-cleanup:
    name: Stage 6 - Shutdown & Cleanup
    runs-on: ubuntu-latest
    needs: stage-5-verify
    if: always()
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker Images
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker compose -f docker-compose.ci.yml build --no-cache
      
      - name: Start FL System
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          docker compose -f docker-compose.ci.yml up -d mlflow-server fl-dashboard flower-server-lstm flower-worker-1 flower-worker-2
          sleep 15
      
      - name: Shutdown & Cleanup
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=========================================="
          echo "Stage 6: Shutting down and cleaning up"
          echo "=========================================="
          
          # Stop all containers
          docker compose -f docker-compose.ci.yml down -v
          
          # Clean up Docker resources
          docker system prune -f
          
          echo "Cleanup completed"

